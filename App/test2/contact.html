<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test2 - Contact</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="text-center bg-light mt-5">
  <h1>Contact Messages</h1>
  <div id="contacts" class="container mt-4"></div>

  <script>
  fetch("http://localhost:5000/about")  // if you renamed route to /contact, change here too
    .then(res => res.json())
    .then(data => {
      const div = document.getElementById("contacts");
      data.forEach(c => {
        div.innerHTML += `
          <div class="card mb-3 shadow-sm p-3">
            <h5>${c.title}</h5>
            <p>${c.description}</p>
          </div>`;
      });
    })
    .catch(err => console.error("Error fetching data:", err));
  </script>
</body>
</html>
