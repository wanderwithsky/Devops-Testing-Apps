<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test1 - About</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="text-center bg-light mt-5">
  <h1 id="title"></h1>
  <p id="content"></p>

  <script>
  fetch("http://localhost:5000/home")  // this matches your backend route for test1
    .then(res => res.json())
    .then(data => {
      document.getElementById("title").innerText = data[0].title;
      document.getElementById("content").innerText = data[0].content;
    })
    .catch(err => console.error("Error fetching data:", err));
  </script>
</body>
</html>
