version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: sampledb
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - appnet

  # App 1
  test1:
    build: ./test1
    container_name: test1
    networks:
      - appnet

  # App 2
  test2:
    build: ./test2
    container_name: test2
    networks:
      - appnet

  # App 3
  test3:
    build: ./test3
    container_name: test3
    networks:
      - appnet

  # Reverse Proxy (Main Nginx)
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - test1
      - test2
      - test3
    networks:
      - appnet

networks:
  appnet:

volumes:
  mysql_data:
