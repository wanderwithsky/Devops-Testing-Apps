
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}

http {
    server {
        listen 80;

        location /test1/ {
            proxy_pass http://test1/;
        }

        location /test2/ {
            proxy_pass http://test2/;
        }

        location /test3/ {
            proxy_pass http://test3/;
        }
    }
}

